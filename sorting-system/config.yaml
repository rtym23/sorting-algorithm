# Sorting System Configuration
# All dimensions in mm, speeds in mm/s, masses in kg, time in seconds

robot:
  base_position: [3000, 5000, 0]  # mm [x, y, z]
  reach: 3500.0                   # mm horizontal reach
  height: 1500.0                  # mm max lift height
  max_payload: 20.0               # kg
  move_speed: 2000.0              # mm/s
  cycle_time: 3.0                 # seconds (target cycle time)
  item_density: 5e-7              # kg/mm^3 (~500 kg/m^3)
  gripper:
    jaw_width: 500.0              # mm (fits items up to 450 mm wide)
    max_force: 300.0              # N (holds up to the 20 kg max payload)
    grip_type: "parallel"         # parallel, suction, adaptive

classifier:
  # Dimension bounds
  min_size: 10.0                  # mm
  max_size_x: 450.0               # mm
  max_size_y: 320.0               # mm
  max_size_z: 320.0               # mm
  # Roundness detection
  roundness_threshold: 0.8        # ratio inscribed/circumscribed
  # Section planes through the centroid: the 3 principal-axis planes plus a
  # rotational sweep of `cross_section_angles` steps around each axis.
  # Round sections trigger an early exit, so small values are both fast and reliable.
  cross_section_angles: 4
  # Performance
  cache_enabled: true             # cache extraction results by file hash
  monte_carlo_samples: 50         # samples for inscribed circle (reduced from 100)
  welzl_randomized: true          # use randomized Welzl for min enclosing circle

simulation:
  conveyor:
    length: 6000.0                # mm
    width: 500.0                  # mm
    height: 700.0                 # mm (from ground)
    speed: 1000.0                 # mm/s (1 m/s)
  cell:
    working_area_x: 6000.0        # mm
    working_area_y: 10000.0       # mm
    max_time: 30.0                # seconds per batch
    dt: 0.01                      # seconds (simulation timestep)
  zones:
    A:
      position: [0, 5000, 0]
      size: [500, 700, 2000]
      type: "conveyor"
    B:
      position: [2000, 5000, 0]
      size: [500, 700, 2000]
      type: "conveyor"
    C:
      position: [4000, 2000, 0]
      size: [1200, 800, 800]
      type: "rollcage"
    D:
      position: [4000, 8000, 0]
      size: [1200, 800, 800]
      type: "rollcage"

logging:
  level: "INFO"                   # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
  file: "sorting_system.log"      # empty = stdout only


